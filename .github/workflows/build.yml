name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build -v ./...
      - run: go vet ./...
      - run: go test -v ./...

  release:
    # статические бинарники при пуше тега v*
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: build linux and windows
        run: |
          mkdir dist
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/gokev-linux-amd64 .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/gokev-windows-amd64.exe .
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
